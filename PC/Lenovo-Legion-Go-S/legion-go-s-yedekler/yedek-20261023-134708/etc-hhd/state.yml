version: a8177b59
tdp:
  tdp:
    tdp_enable: false
controllers:
  legion_gos:
    xinput:
      mode: default
      hidden:
        info: default
        noob_mode: default
      uinput:
        info: default
        paddles_as: default
        nintendo_qam: default
      xbox_elite:
        info: default
      dualsense:
        info: default
        paddles_as: default
        led_support: default
        sync_gyro: default
        flip_z: default
        bluetooth_mode: default
    mapping:
      mode: default
      windows:
        turbo: default
    touchpad: default
    freq: default
    swap_legion: default
    nintendo_mode: default
    select_reboots: default
    shortcuts: default
gamemode:
  power:
    hibernate_auto: default
shortcuts:
  controller:
    xbox_y: default
    xbox_b: default
    xbox_a: default
    xbox_x: default
    allow_select: default
  touchscreen:
    bottom: default
    right_top: default
    right_bottom: default
    left_top: default
    left_bottom: default
    top: default
    orientation:
      mode: default
      manual:
        dmi: default
        portrait: default
        flip_x: default
        flip_y: default
  keyboard:
    meta_press: default
    meta_hold: default
    ctrl_3: default
    ctrl_4: default
hhd:
  settings:
    language: default
    theme: default
    tdp_enable: true
    enforce_limits: default
    powerbuttond: default
  http:
    localhost: default
    token: default
  steamos:
    gpu_set: default

